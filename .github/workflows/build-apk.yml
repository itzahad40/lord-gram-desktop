# Cloud build. Repo secrets chahiye:
#   LG_API_ID, LG_API_HASH, LG_PACKAGE, LG_APP_NAME,
#   RELEASE_KEYSTORE_B64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS
name: Build Lord Gram APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          A: ${{ secrets.LG_API_ID }}
          B: ${{ secrets.LG_API_HASH }}
          C: ${{ secrets.LG_PACKAGE }}
          D: ${{ secrets.LG_APP_NAME }}
          E: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          F: ${{ secrets.RELEASE_STORE_PASSWORD }}
          G: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          bad=0
          chk() { if [ -n "$2" ]; then echo "$1: SET"; else echo "$1: EMPTY  <-- ye secret dobara banao"; bad=1; fi; }
          chk LG_API_ID "$A"; chk LG_API_HASH "$B"; chk LG_PACKAGE "$C"; chk LG_APP_NAME "$D"
          chk RELEASE_KEYSTORE_B64 "$E"; chk RELEASE_STORE_PASSWORD "$F"; chk RELEASE_KEY_ALIAS "$G"
          exit $bad

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /opt/az
          sudo docker image prune -af || true
          df -h /
          free -m

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Fetch, patch, rebrand
        env:
          LG_API_ID: ${{ secrets.LG_API_ID }}
          LG_API_HASH: ${{ secrets.LG_API_HASH }}
          LG_PACKAGE: ${{ secrets.LG_PACKAGE }}
          LG_APP_NAME: ${{ secrets.LG_APP_NAME }}
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          python3 - "$RUNNER_TEMP/lordgram.keystore" <<'PY'
          import base64, os, sys
          encoded = "".join(os.environ.get("KS_B64", "").split())
          try:
              keystore = base64.b64decode(encoded, validate=True)
          except Exception:
              raise SystemExit("RELEASE_KEYSTORE_B64 valid base64 nahi hai. Secret dobara banao.")
          if len(keystore) < 500:
              raise SystemExit("RELEASE_KEYSTORE_B64 bahut chhota hai (%d bytes). Paste adhura hua." % len(keystore))
          open(sys.argv[1], "wb").write(keystore)
          print("keystore decoded:", len(keystore), "bytes")
          PY
          if ! keytool -list -keystore "$RUNNER_TEMP/lordgram.keystore" -storepass "$KS_PASS" -alias "$KS_ALIAS"; then
            echo "KEYTOOL FAILED: RELEASE_STORE_PASSWORD ya RELEASE_KEY_ALIAS galat hai, ya keystore kharab hai"
            exit 1
          fi
          printf 'LG_PACKAGE=%s\nLG_APP_NAME=%s\nLG_API_ID=%s\nLG_API_HASH=%s\n' "$LG_PACKAGE" "$LG_APP_NAME" "$LG_API_ID" "$LG_API_HASH" > lordgram.config
          printf 'export ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=%s\nexport ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=%s\nexport ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=%s\n' "$KS_PASS" "$KS_PASS" "$KS_ALIAS" > signing.env
          python3 -m pip install --quiet --break-system-packages pillow
          bash scripts/setup.sh
          cp "$RUNNER_TEMP/lordgram.keystore" build-src/TMessagesProj/config/release.keystore
          rm "$RUNNER_TEMP/lordgram.keystore"

      - name: Fix Kotlin DSL plugin resolution (buildSrc needs mavenCentral too)
        run: |
          { printf 'pluginManagement {\n    repositories {\n        gradlePluginPortal()\n        mavenCentral()\n        google()\n    }\n}\n\n'; cat build-src/settings.gradle; } > /tmp/settings.gradle.new
          mv /tmp/settings.gradle.new build-src/settings.gradle
          head -12 build-src/settings.gradle

      - name: Disable Telegram Firebase config (not valid for Lord Gram package)
        run: |
          sed -i "s|^apply plugin: 'com.google.gms.google-services'|// disabled for Lord Gram|" build-src/TMessagesProj_App/build.gradle build-src/TMessagesProj/build.gradle
          grep -n "disabled for Lord Gram" build-src/TMessagesProj_App/build.gradle build-src/TMessagesProj/build.gradle

      - name: Build only arm64 (much faster)
        run: |
          sed -i 's|abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"|abiFilters "arm64-v8a"|' build-src/TMessagesProj_App/build.gradle
          grep -n 'abiFilters' build-src/TMessagesProj_App/build.gradle

      - name: Skip R8 (it ran out of memory on the runner)
        run: |
          sed -i 's/minifyEnabled true/minifyEnabled false/; s/shrinkResources true/shrinkResources false/' build-src/TMessagesProj_App/build.gradle
          grep -n "minifyEnabled\|shrinkResources" build-src/TMessagesProj_App/build.gradle

      - name: Build
        run: bash scripts/build.sh

      - name: Diagnostics
        if: always()
        run: |
          df -h / || true
          free -m || true
          sudo dmesg 2>/dev/null | grep -i -E "out of memory|killed process" | tail -5 || true

      - uses: actions/upload-artifact@v4
        with:
          name: LordGram-apk
          path: build-src/TMessagesProj_App/build/outputs/apk/**/*.apk
